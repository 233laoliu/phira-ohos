name: Build HAP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # HarmonyOS 命令行工具版本（SDK 内嵌，无需 DevEco Studio）。
  # 本机开发用的是 DevEco 6.0.1.251 / SDK 6.0.1.112 (API 21)，
  # 6.1.x 的 hvigor 向后兼容工程里的 modelVersion 6.0.0。
  CLI_TOOLS_VERSION: '6.1.1.280'
  # phiraiad（Rust 引擎侧）仓库与提交，对应本地 build-libphira.cmd 使用的版本。
  PHIRAAD_REPO: 'Adai-add/PhiraiAd'
  PHIRAAD_REF: 'a60b49a'
  RUST_NIGHTLY: 'nightly-2026-09-14'

jobs:
  native:
    name: libphira.so (Rust -> aarch64-linux-ohos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phiraiad
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PHIRAAD_REPO }}
          ref: ${{ env.PHIRAAD_REF }}
          path: phiraiad

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          rustup target add aarch64-unknown-linux-ohos --toolchain "$RUST_NIGHTLY"
          rustup default "$RUST_NIGHTLY"

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.CLI_TOOLS_VERSION }}

      - name: Inspect NDK layout
        run: |
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          echo "OHOS_NDK_HOME=$OHOS_NDK_HOME"
          ls "$OHOS_NDK_HOME/native/llvm/bin/" | head -5
          ls "$HOS_SDK_HOME/default/hms/native/sysroot/usr/lib/aarch64-linux-ohos/" | grep -i opengtx \
            || echo "WARN: hms sysroot not found, libopengtx link may fail"

      # phiraiad 仓库把 .cargo/ 加入了 .gitignore，本机的 .cargo/config.toml
      # （Windows 路径版）不会进版本库，这里在 CI 上生成等价的 Linux 版。
      # 要点与 scripts/build-libphira.cmd 一致：NDK clang 直接链接、
      # --sysroot 指向 OHOS sysroot、-D__MUSL__、lld、HMS sysroot 提供 libopengtx。
      - name: Write Linux cargo config
        run: |
          NDK="$OHOS_NDK_HOME/native"
          HMS_LIB="$HOS_SDK_HOME/default/hms/native/sysroot/usr/lib/aarch64-linux-ohos"
          mkdir -p phiraiad/.cargo
          cat > phiraiad/.cargo/config.toml <<EOF
          # Generated by .github/workflows/build.yml (Linux CI).
          [target.aarch64-unknown-linux-ohos]
          linker = "$NDK/llvm/bin/clang"
          rustflags = [
            "-C", "link-arg=--target=aarch64-linux-ohos",
            "-C", "link-arg=--sysroot=$NDK/sysroot",
            "-C", "link-arg=-D__MUSL__",
            "-C", "link-arg=-fuse-ld=lld",
            "-C", "link-arg=-L$HMS_LIB",
          ]
          EOF
          cat phiraiad/.cargo/config.toml

      - name: Build libphira.so
        working-directory: phiraiad/phira
        run: |
          NDK="$OHOS_NDK_HOME/native"
          export CC_aarch64_unknown_linux_ohos="$NDK/llvm/bin/clang"
          export CXX_aarch64_unknown_linux_ohos="$NDK/llvm/bin/clang++"
          export AR_aarch64_unknown_linux_ohos="$NDK/llvm/bin/llvm-ar"
          export CFLAGS_aarch64_unknown_linux_ohos="--target=aarch64-linux-ohos --sysroot=$NDK/sysroot -D__MUSL__"
          export CXXFLAGS_aarch64_unknown_linux_ohos="$CFLAGS_aarch64_unknown_linux_ohos"
          export CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_ohos="$NDK/build/cmake/ohos.toolchain.cmake"
          export CMAKE_GENERATOR=Ninja
          cargo +"$RUST_NIGHTLY" build --target aarch64-unknown-linux-ohos --release

      - name: Check .so dependencies
        run: |
          SO=phiraiad/target/aarch64-unknown-linux-ohos/release/libphira.so
          ls -la "$SO"
          "$OHOS_NDK_HOME/native/llvm/bin/llvm-readelf" -d "$SO" | grep NEEDED || true

      - name: Upload libphira.so
        uses: actions/upload-artifact@v4
        with:
          name: libphira
          path: phiraiad/target/aarch64-unknown-linux-ohos/release/libphira.so
          if-no-files-found: error

  hap:
    name: HAP (hvigor assembleHap)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.CLI_TOOLS_VERSION }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download libphira.so
        uses: actions/download-artifact@v4
        with:
          name: libphira
          path: entry/libs/arm64-v8a

      # libphira.so 动态依赖 libc++_shared.so（readelf 证实），必须随包分发。
      - name: Copy libc++_shared.so from NDK
        run: cp "$OHOS_NDK_HOME/native/llvm/lib/aarch64-linux-ohos/libc++_shared.so" entry/libs/arm64-v8a/

      # 仓库内提交的是无签名模板；CI 构建未签名 debug HAP。
      - name: Prepare build profile
        run: cp build-profile-nosigncfg.json5 build-profile.json5

      - name: Install dependencies
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          ohpm install

      - name: Build HAP
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          hvigorw assembleHap -p product=default -p buildMode=debug --no-daemon

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: phira-hap-debug
          path: entry/build/default/outputs/default/entry-default-unsigned.hap
          if-no-files-found: error
